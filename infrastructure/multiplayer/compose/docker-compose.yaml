# The default is the directory's name, which the search stack on the same host shares.
name: spaceguesser-multiplayer

services:
  postgres:
    image: postgres:18-alpine
    container_name: spaceguesser-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=multiplayer
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?}
      - POSTGRES_DB=multiplayer
    # A few hundred small rows: sized to stay out of the search index's memory.
    command: postgres -c shared_buffers=32MB -c max_connections=20
    mem_limit: 1g
    memswap_limit: 1g
    volumes:
      - ${PG_DATA_HOST_DIR:-/srv/spaceguesser/pg_data}:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U multiplayer"]
      interval: 5s
      retries: 12
    networks:
      - multiplayer

  multiplayer:
    image: ghcr.io/julie-dujardin/spaceguesser-backend:latest
    container_name: spaceguesser-multiplayer
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgres://multiplayer:${POSTGRES_PASSWORD:?}@postgres/multiplayer
      # Required: the server reads an empty list as "any origin", for development.
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:?}
      # Unset, the server asks nobody for proof of a person.
      - TURNSTILE_SECRET=${TURNSTILE_SECRET:-}
      - TURNSTILE_REQUIRE=${TURNSTILE_REQUIRE:-}
    # Every player is an open file, and a container's soft limit is 1024.
    ulimits:
      nofile: 65536
    # A backstop for the search index on the same host: the server's own caps
    # are what bound it, and only a fault or a flood gets this far. The same
    # figure for memory and swap together leaves it no swap: Docker otherwise
    # gives a container as much again of the host's.
    mem_limit: 4g
    memswap_limit: 4g
    # The game has no host port: its only way in is the tunnel (TLS terminates at
    # Cloudflare). Its counts have one, for Prometheus. Never on 0.0.0.0: Docker
    # opens a published port past the host's firewall.
    ports:
      - "${METRICS_HOST:-127.0.0.1}:9787:9787"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The image has no HTTP client, so bash opens the socket itself.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8787
          && printf 'GET /healthz HTTP/1.0\r\n\r\n' >&3
          && grep -q '^HTTP/1.[01] 200' <&3
      interval: 5s
      # Nothing in the probe gives up on a server that accepts and never answers.
      timeout: 3s
      retries: 12
    networks:
      - multiplayer

  cloudflared:
    image: cloudflare/cloudflared:2026.6.1
    container_name: spaceguesser-multiplayer-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:?}
    depends_on:
      multiplayer:
        condition: service_healthy
    networks:
      - multiplayer

networks:
  multiplayer:
