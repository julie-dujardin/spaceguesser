<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<title>spaceguesser</title>
		<meta
			name="description"
			content="Figure out where you are in the solar system. Look around, then place your guess on the map."
		/>
		<!-- One card for every link, an invite or a shared run too: the page is one
		     file, and whatever draws the card does not run the app. -->
		<meta property="og:type" content="website" />
		<meta property="og:title" content="spaceguesser" />
		<meta
			property="og:description"
			content="Figure out where you are in the solar system. Look around, then place your guess on the map."
		/>
		<meta property="og:image" content="https://spaceguesser.com/og.jpg" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta name="twitter:card" content="summary_large_image" />
		<!-- The deployment's settings, ahead of the app that reads them. -->
		<script src="/env.js" vite-ignore></script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
