# Development: the multiplayer server and its database, on localhost.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      - POSTGRES_USER=multiplayer
      - POSTGRES_PASSWORD=dev
      - POSTGRES_DB=multiplayer
    # Published for running the server or its tests outside the stack.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg-dev-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U multiplayer"]
      interval: 2s
      retries: 15

  multiplayer:
    build: ./backend
    environment:
      - DATABASE_URL=postgres://multiplayer:dev@postgres/multiplayer
    ports:
      - "127.0.0.1:8787:8787"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg-dev-data:
