name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - run: pnpm test

      - run: pnpm exec prettier --check .

      - run: pnpm build
        env:
          # wss://<the tunnel's hostname>/ws. Unset, the build has no multiplayer.
          VITE_MULTIPLAYER_URL: ${{ vars.MULTIPLAYER_URL }}
          # The Turnstile widget's. Unset, the build sends the server no proof.
          VITE_TURNSTILE_SITEKEY: ${{ vars.TURNSTILE_SITEKEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: frontend/dist

  deploy:
    # `needs` already holds this back until the checks pass; naming the branch
    # keeps a second push trigger, added later, from shipping by accident.
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Holds the Cloudflare credentials.
    environment: cf-pages-deploy
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # Ships the bytes the checks ran against, rather than building twice.
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: frontend/dist

      - run: pnpm exec wrangler deploy --config ../infrastructure/deploy/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
